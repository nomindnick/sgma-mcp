[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgma-mcp"
version = "0.1.0"
description = "MCP server for California's Sustainable Groundwater Management Act (SGMA) legal corpus"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "sqlite-vec>=0.1.6",
    "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
pdf = [
    "pymupdf>=1.24",
]

[project.scripts]
sgma-mcp = "sgma_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sgma_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
